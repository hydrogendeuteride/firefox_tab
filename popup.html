<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="extensionName">Window Tabs</title>
<link rel="stylesheet" href="popup.css">
<script src="i18n.js" defer></script><script src="popup.js" defer></script>
</head><body>
<header class="brand"><img src="icon.svg" width="36" height="36" alt=""><div>
<h1 data-i18n="extensionName">Window Tabs</h1><p id="summary" class="muted" data-i18n="loadingTabs"></p>
</div></header>
<main><label for="format" data-i18n="fileFormat"></label>
<select id="format">
<option value="markdown" data-i18n="formatMarkdown"></option>
<option value="text" data-i18n="formatText"></option>
<option value="urls" data-i18n="formatUrls"></option>
<option value="json" data-i18n="formatJson"></option>
</select>
<button id="export" type="button" disabled data-i18n="exportButton"></button>
<p id="status" role="status" aria-live="polite"></p></main>
<footer class="popup-footer">
<button id="open-import" class="secondary" type="button" disabled data-i18n="importTitle"></button>
<button id="open-settings" class="quiet" type="button" data-i18n="settingsTitle"></button>
</footer></body></html>
